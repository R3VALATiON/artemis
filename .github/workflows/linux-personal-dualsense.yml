name: Steam Deck Personal DualSense Preview
run-name: "UNOFFICIAL Steam Deck DualSense personal testing #${{ github.run_number }}"
on:
  workflow_dispatch:
  push:
    branches: [linux/steamdeck-dualsense-preview]
    paths: [".github/workflows/linux-personal-dualsense.yml", "app/**", "moonlight-common-c/**", "tests/native-feedback/**", "packaging/linux-personal/**", ".gitmodules", "LINUX_DUALSENSE.md", "CHANGELOG_LINUX.md"]
permissions:
  contents: write
concurrency:
  group: steamdeck-personal-dualsense
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      TAG: v0.3.1-steamdeck-personal-preview.1
      OUTPUT: Artemis-SteamDeck-Personal-Testing-0.3.1-preview.1-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux/steamdeck-dualsense-preview
          submodules: recursive
      - name: Test feedback protocol and quality policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/native-feedback/policy_test.cpp -o /tmp/native-feedback-test
          /tmp/native-feedback-test
      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libegl1-mesa-dev libgl1-mesa-dev libopus-dev \
            libsdl2-dev libsdl2-ttf-dev libssl-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libva-dev libvdpau-dev libxkbcommon-dev wayland-protocols libdrm-dev \
            nasm libgbm-dev libfreetype6-dev libasound2-dev libdbus-1-dev libgles2-mesa-dev \
            libglu1-mesa-dev libibus-1.0-dev libpulse-dev libudev-dev libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxt-dev libxv-dev \
            libxxf86vm-dev libxcb-dri3-dev libx11-xcb-dev libplacebo-dev libxcb-cursor0 \
            xvfb patchelf desktop-file-utils libfuse2 gdb weston libwayland-dev libpipewire-0.3-dev libdecor-0-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          modules: qtmultimedia
          cache: true
      - name: Build pinned SDL2 with modern Linux controller support
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/SDL2.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          echo "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165  $RUNNER_TEMP/SDL2.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/SDL2.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL2-2.32.10" -B "$RUNNER_TEMP/sdl-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/artemis-sdl" \
            -DCMAKE_INSTALL_LIBDIR=lib -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$RUNNER_TEMP/sdl-build" --parallel 4
          cmake --install "$RUNNER_TEMP/sdl-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/artemis-sdl/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/artemis-sdl/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Compile Artemis client
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          qmake6 artemis.pro CONFIG+=release "QMAKE_CXXFLAGS+=-fPIC"
          make -j4
          file app/artemis
      - name: Package portable client and AppImage
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps release deploy-tools
          cp app/artemis AppDir/usr/bin/
          cp app/artemis.png AppDir/usr/share/icons/hicolor/256x256/apps/artemis-personal.png
          cat > AppDir/usr/share/applications/artemis-personal.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Artemis DS Personal Test
          Comment=Unofficial personal DualSense development and testing preview
          Exec=artemis
          Icon=artemis-personal
          Categories=Game;Network;
          Terminal=false
          DESKTOP
          cp LINUX_DUALSENSE.md CHANGELOG_LINUX.md AppDir/
          cp packaging/linux-personal/70-artemis-dualsense.rules AppDir/
          mkdir -p AppDir/usr/share/doc/artemis-personal
          cp LICENSE* AppDir/usr/share/doc/artemis-personal/
          cp moonlight-common-c/moonlight-common-c/LICENSE.txt AppDir/usr/share/doc/artemis-personal/LICENSE-moonlight-common-c.txt
          cat > BUILD_INFO.md <<INFO
          # UNOFFICIAL PERSONAL DEVELOPMENT / TESTING PREVIEW
          Repository: $GITHUB_REPOSITORY
          Revision: $(git rev-parse HEAD)
          Release: $TAG
          Upstream app version: 0.6.7; personal app version: 0.6.7-personal-dev.0.3.1
          Architecture: Linux x86-64; Ubuntu 22.04 / glibc 2.35 baseline
          SteamOS target: 3.9.5 stable (Valve release and repository reference checked 2026-11-01)
          SDL: 2.32.10, archive SHA-256 verified
          Qt: 6.8.3
          Protocol dependency: Taveszfito/moonlight-android 5fd8827d870b860beb000f68cbc76f19a0056546
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Independent experimental fork; no upstream affiliation or endorsement.
          Physical controller, game compatibility and distribution-specific behavior remain unverified.
          INFO
          cp BUILD_INFO.md AppDir/
          curl -fL --retry 3 -o deploy-tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 -o deploy-tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x deploy-tools/*.AppImage
          export PATH="$PWD/deploy-tools:$QT_ROOT_DIR/bin:$QT_ROOT_DIR/libexec:$PATH"
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          export QML_SOURCES_PATHS="$PWD/app/gui"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          export OUTPUT="$OUTPUT.AppImage"
          deploy-tools/linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable app/artemis --desktop-file AppDir/usr/share/applications/artemis-personal.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/artemis-personal.png --plugin qt
          # Use the coherent SteamOS graphics/audio platform stack, not Ubuntu drivers.
          find AppDir/usr/lib -maxdepth 1 \( -name 'libGL*.so*' -o -name 'libEGL.so*' -o -name 'libOpenGL.so*' -o -name 'libvulkan.so*' -o -name 'libgbm.so*' -o -name 'libdrm*.so*' -o -name 'libva*.so*' -o -name 'libvdpau.so*' -o -name 'libasound.so*' -o -name 'libpipewire*.so*' \) -delete
          cp packaging/linux-personal/steamdeck-launch.sh packaging/linux-personal/install-steamdeck.sh packaging/linux-personal/check-steamdeck.sh AppDir/
          chmod +x AppDir/*.sh
          cp STEAM_DECK.md STEAMOS_PACKAGE_REFERENCE.json AppDir/
          cp "$RUNNER_TEMP/SDL2-2.32.10/LICENSE.txt" AppDir/usr/share/doc/artemis-personal/LICENSE-SDL2.txt
          python3 tools/audit-linux-bundle.py AppDir --output COMPATIBILITY_AUDIT.json
          cp COMPATIBILITY_AUDIT.json AppDir/
          curl -fL --retry 3 -o deploy-tools/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x deploy-tools/appimagetool.AppImage
          ARCH=x86_64 deploy-tools/appimagetool.AppImage AppDir "release/$OUTPUT"
      - name: Smoke-test bundled client without build-time Qt environment
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH \
            QT_QPA_PLATFORM=xcb ./AppDir/AppRun --help > cli-smoke.log 2>&1
          cat cli-smoke.log
          set +e
          timeout 15 xvfb-run -a -s "-screen 0 1280x800x24" env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH \
            QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software ./AppDir/AppRun > ui-smoke.log 2>&1
          result=$?
          set -e
          cat ui-smoke.log
          test "$result" -eq 124
          if grep -E 'QQmlApplicationEngine failed|module .* is not installed|error while loading shared libraries|Cannot load library|failed to load component' ui-smoke.log; then exit 1; fi
      - name: Smoke-test native Wayland UI at Steam Deck resolution
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-artemis --idle-time=0 --width=1280 --height=800 --use-pixman > weston-smoke.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do test -S "$XDG_RUNTIME_DIR/wayland-artemis" && break; sleep 0.1; done
          test -S "$XDG_RUNTIME_DIR/wayland-artemis"
          set +e
          timeout 15 env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH \
            WAYLAND_DISPLAY=wayland-artemis QT_QPA_PLATFORM=wayland SDL_VIDEODRIVER=wayland QT_QUICK_BACKEND=software \
            ./AppDir/steamdeck-launch.sh > wayland-smoke.log 2>&1
          result=$?
          set -e
          cat wayland-smoke.log
          test "$result" -eq 124
          if grep -E 'QQmlApplicationEngine failed|module .* is not installed|error while loading shared libraries|Cannot load library|failed to load component' wayland-smoke.log; then exit 1; fi
      - name: Finish release assets and provenance
        run: |
          set -euo pipefail
          cp cli-smoke.log ui-smoke.log wayland-smoke.log weston-smoke.log BUILD_INFO.md AppDir/
          mv AppDir "$OUTPUT"
          tar -czf "release/$OUTPUT.tar.gz" "$OUTPUT"
          cp LINUX_DUALSENSE.md CHANGELOG_LINUX.md BUILD_INFO.md STEAM_DECK.md STEAMOS_PACKAGE_REFERENCE.json COMPATIBILITY_AUDIT.json release/
          cp packaging/linux-personal/steamdeck-launch.sh release/
          cp packaging/linux-personal/70-artemis-dualsense.rules release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat BUILD_INFO.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: UNOFFICIAL-Artemis-SteamDeck-Personal-DualSense-x86_64
          path: release/*
          if-no-files-found: error
      - name: Publish personal Linux prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release exists; refusing to replace published binaries.'
            exit 1
          fi
          gh release create "$TAG" release/* --target "$(git rev-parse HEAD)" --prerelease --latest=false \
            --title 'Artemis Steam Deck 0.3.1 Preview 1 — Unofficial Personal Development & Testing' \
            --notes-file CHANGELOG_LINUX.md
      - name: Capture startup backtrace on failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -f AppDir/usr/bin/artemis ]; then
            timeout 30 xvfb-run -a -s "-screen 0 1280x800x24" env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software \
              gdb --batch -ex run -ex 'thread apply all bt' --args AppDir/usr/bin/artemis > startup-backtrace.log 2>&1 || true
            tail -100 startup-backtrace.log
          fi
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-personal-preview-failure-logs
          path: |
            *smoke.log
            COMPATIBILITY_AUDIT.json
            startup-backtrace.log
            linuxdeploy*.log
            release/*.AppImage
